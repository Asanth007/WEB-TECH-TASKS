<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Navbar</title>
    <style>
      * {
        margin: 0;
        padding: 0;
      }
      
      .nav-bar {
        
        display: flex;
        justify-content: space-between;
        height: 75px;
        width: 100%;
        background-color: #2874f0;
        color: aliceblue;
      }
      .left {
        
        display: flex;
        justify-content: space-around;
        align-items: center;
        width: 30%;
        padding: 10px;
      }

      .right {
        
        display: flex;
        width: 30%;
        align-items: center;
        justify-content: space-evenly;
      }

      a {
        display: flex;
        align-items: center;
      }
      a:link {
        color: aliceblue;
        text-decoration: none;
      }
      a:hover {
        color: aqua;
        background-color:#2874f0;
      }
      input {
        width: 12rem;
        padding: 10px;
        border-radius: 5px;
        border: none;
      }
      ol{
        display: flex;
        width: 50%;
        align-items: center;
        justify-content: space-between;
      }
      li:hover{
        cursor: pointer;
        color: white;
      }
      li{
    color: rgba(224, 222, 222, 0.6);
       list-style: none;
      }
      button {
        width: 5rem;
        padding: 10px;
        border-radius: 5px;
        background-color:#2874f0;
        border: 1px solid white;
        color: aliceblue;
      }
      button:hover {
        background-color: aliceblue;
        color:#2874f0;
        transition: 0.3s;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="nav-bar">
      <div class="left">
        <h2>Brand</h2>
        
        <ol>
          <li>Home</li>
          <li>About</li>
          <li>Product</li>
        </ol>
        
      </div>

      <div class="right">
        <div id="search">
            <input  type="text" placeholder="Search" />
        </div>
        
        <button>Search</button>
      </div>
    </div>
  </body>
</html>
