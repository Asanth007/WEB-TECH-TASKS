<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            display: flex;
            justify-content: space-evenly;
            margin: 50px;
        }
        .img-box{
            height: 200px;
            width: 200px;
            background-color: aquamarine;
            border-radius: 20px;
            border: 10px solid rosybrown;
            transition: all 1s linear ;
        }
        #zoom:hover{
            transform: scale(1.5);
            background-color: khaki;
        }
        #skew:hover{
            transform: scale(1.5);
            background-color: khaki;
        }
        #rotate:hover{
            transform: scale(1.5);
            background-color: khaki;
        }
        img{
            height: 100%;
            width: 100%;
        }

    </style>
</head>
<body>
    <div class="container">
    <div class="img-box" id="zoom">
        <img src="https://i.pinimg.com/1200x/28/91/34/289134bc5561b1203bdb63e5bcbf5b7e.jpg"  alt="">
    </div>
    <div class="img-box" id="skew">
        <img src="https://i.pinimg.com/originals/95/58/f6/9558f63411b5002237068011c3bec511.jpg" >
    </div>
    <div class="img-box" id="rotate">
        <img src="https://i1.sndcdn.com/artworks-Tv8m2CqEAdzzT7NC-4gSSQw-t500x500.jpg"  alt="">
    </div>

    
    </div>
</body>
</html>
