<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Box Model</title>
    <style>
      .box {
        background-color: blueviolet;
        border: 1px solid black;
        height: 200px;
        width: 200px;
        display: flex;
        justify-content: center;
        align-items: center;
        margin: 20px;
      }
      h2{
        padding: 70px 20px 40px 60px;
        border: 1px solid black;
        margin: 20px;
      }
    </style>
  </head>
  <body>
    <div class="box">
      <h2>Hello</h2>
    </div>
  </body>
</html>
